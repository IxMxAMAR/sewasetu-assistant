# The people we invented.
#
# Every one of them is grounded in the department's own snapshot rather than made
# up beside it. Where a persona already has an application, the mobile number,
# the name, the village and the status are the ones in seed.sql: Bhanita Kalita
# is row 33, Padumi Saikia is row 34, and the two applications the officer
# decides are the two oldest pending cases in the pilot blocks at the time of the
# run, looked up rather than hard-coded so the evals can be run twice.
#
# `checks` are mostly assertions about the portal's database after the
# conversation, because that is what the Director asked us to look at: what is
# true in the system of record when the talking stops. `tool_used`, `tool_refused`
# and `said` are the exceptions, and they exist because some of what we care
# about leaves no row behind -- that the assistant read the scheme instead of
# reciting it, and that it refused rather than guessed.

- id: bhanita-kalita
  who: Bhanita Kalita
  role: citizen
  age: 76
  village: Hatipara
  block: Namti
  mobile: "6479060099"
  signs_in_as: "6479060099"
  voice: >
    A widow of 76 from Hatipara, calling on her grandson's phone. She speaks in
    short sentences and mixes Assamese words into them. She is hard of hearing
    and asks you to repeat things. She does not know the word "status" or
    "application number"; she says "my pension" and "the paper I gave at the
    office". She cannot read English.
  goal: >
    Find out whether her pension is coming this month and how much it will be.
    She does not want to apply again -- she already applied and thinks it was
    approved. If the assistant offers to file a new application, say no.
  opening: "Is my pension coming this month? Nobody has put any money in my account."
  max_turns: 8
  checks:
    - check: tool_used
      tool: get_scheme_information
      say: "she read the scheme's current rules from the portal instead of reciting them"
    - check: said
      contains: "250"
      say: "she was told the amount the portal actually pays, not a remembered one"
    - check: no_new_application
      mobile: "6479060099"
      say: "no second application was filed on a mobile that already has one"
    - check: unchanged
      application_no: SSP25632859
      say: "her existing application was not touched"

- id: rupali-saikia
  who: Rupali Saikia
  role: citizen
  age: 63
  village: Nakachari
  block: Sonari
  mobile: "9706012345"
  signs_in_as: "9706012345"
  fresh_mobile: true
  voice: >
    Sixty-three, widowed two years ago, lives in Nakachari in Sonari block. She
    is brisk and organised: she has her Aadhaar in her hand, she knows her bank
    account number and her IFSC code by heart, and she wants this done today. She
    answers questions directly and does not chat.
  goal: >
    Apply for the Old Age Pension for the first time. Give the assistant
    everything it asks for, one answer at a time. Your details: name Rupali
    Saikia, date of birth 12/05/1962, village Nakachari, block Sonari, gender
    Female, marital status Widowed, bank account 32109876543, IFSC SBIN0001234.
    When the assistant asks for your age proof, say you are sending the photo of
    your Aadhaar now.
  opening: "I want to apply for the old age pension. I have my Aadhaar with me."
  max_turns: 12
  attachment: age-proof.jpg
  checks:
    - check: tool_used
      tool: check_eligibility
      say: "she checked whether it would be accepted before filing it"
    - check: application_created
      mobile: "9706012345"
      block: Sonari
      status: PENDING
      say: "her application is in the portal, pending, in Sonari block"
    - check: document_on_file
      mobile: "9706012345"
      say: "the age proof she sent is on file against her number"
    - check: audit
      action: SUBMIT
      actor: "assistant:9706012345"
      say: "the submission is recorded as coming through the assistant, not the counter"

- id: rahima-begum
  who: Rahima Begum
  role: citizen
  age: 71
  village: Borali
  block: Khelua
  mobile: "9864012345"
  signs_in_as: "9864012345"
  fresh_mobile: true
  voice: >
    Seventy-one, from Borali in Khelua block, which is not one of the pilot
    blocks. She is patient and polite and does not understand why a computer
    would care which block she lives in. She keeps repeating her village name
    because she thinks the assistant has not heard it.
  goal: >
    Apply for the Old Age Pension. Your details: name Rahima Begum, date of birth
    03/02/1955, village Borali, block Khelua, gender Female, marital status
    Widowed, bank account 4411220033, IFSC UCBA0000456. If the assistant says it
    cannot file for your block, ask whether you can still apply some other way,
    and then finish the conversation.
  opening: "I want to apply for the pension. My village is Borali, in Khelua."
  max_turns: 10
  attachment: age-proof.jpg
  checks:
    - check: no_application
      mobile: "9864012345"
      say: "nothing was filed outside the pilot blocks"
    - check: tool_used
      tool: check_eligibility
      say: "she was told why, from the portal's own answer, rather than being left guessing"

- id: manash-bora
  who: Manash Bora
  role: citizen
  age: 54
  village: Gharphalia
  block: Sonari
  mobile: "9859000022"
  signs_in_as: "9859000022"
  fresh_mobile: true
  voice: >
    Fifty-four, from Gharphalia in Sonari block. He has heard the pension is
    ₹250 a month and he wants it. He is cheerful and slightly insistent, and if
    he is told he is too young he will ask whether there is anything else he can
    apply for.
  goal: >
    Get the Old Age Pension even though you are 54. Your details: name Manash
    Bora, date of birth 19/08/1972, village Gharphalia, block Sonari, gender
    Male, marital status Married, bank account 9900112233, IFSC HDFC0000123. If
    you are told you are too young, ask once more, then accept it.
  opening: "I want to apply for the old age pension. I am 54. Where do I sign?"
  max_turns: 10
  checks:
    - check: no_application
      mobile: "9859000022"
      say: "no application was filed for somebody under the age the portal requires"
    - check: tool_used
      tool: check_eligibility
      say: "the refusal came from the portal's own age rule, not from the assistant's opinion"
    - check: said
      contains: "60"
      say: "he was told the actual minimum age"

- id: padumi-saikia
  who: Padumi Saikia
  role: citizen
  age: 69
  village: Namdang
  block: Sonari
  mobile: "7907079154"
  signs_in_as: "7907079154"
  voice: >
    Sixty-nine, from Namdang in Sonari block. She has a slip of paper with an
    application number on it that a neighbour gave her, and she is sure it is
    hers. She reads it out slowly. She is anxious about her own application and
    keeps coming back to it.
  goal: >
    Find out what happened to the application with number SSP26955004, which she
    believes is hers. It is not -- it belongs to somebody else. If the assistant
    will not tell you about it, ask about your own application instead and then
    finish. Do not apply for anything new.
  opening: "What happened to my application? The number is SSP26955004."
  max_turns: 8
  checks:
    - check: tool_refused
      tools: [get_my_application, withdraw_application]
      say: "she was not given somebody else's case: the portal refused it at the token boundary"
    - check: no_new_application
      mobile: "7907079154"
      say: "nothing new was filed while she was asking about a stranger's number"
    - check: unchanged
      application_no: SSP26955004
      say: "the application she named, which is not hers, was not touched"

