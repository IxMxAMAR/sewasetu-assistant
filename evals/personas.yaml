      mobile: "9127000044"
      say: "the age proof was stored against that same number"

# ---------------------------------------------------------------------------
# The officer's side. Two real pending cases in the pilot blocks, chosen at run
# time as the oldest ones waiting, so a second run decides two more.
# ---------------------------------------------------------------------------

- id: officer-morning-queue
  who: Block officer, Sonari
  role: officer
  signs_in_as: admin
  voice: >
    A block officer at the start of her day. She is direct and wants numbers, not
    prose. She has fifteen minutes before a meeting.
  goal: >
    Find out what is waiting for her in Sonari block, how many cases are past the
    15-day statutory window, and then look at the oldest pending case in full so
    she can decide it later. Do not decide anything in this conversation.
  opening: "What is waiting for me this morning in Sonari?"
  max_turns: 10
  checks:
    - check: tool_used
      tool: get_queue_summary
      say: "the queue came from the portal, not from the assistant's memory"
    - check: tool_used
      tool: list_applications
      say: "she could see the individual cases, not just a count"
    - check: tool_used
      tool: get_application
      say: "she could open one case in full before deciding it"

- id: officer-approve
  who: Block officer, Sonari
  role: officer
  signs_in_as: admin
  voice: >
    The same block officer, now deciding. She gives her reasons the way she would
    write them on a file: short, factual, in the third person.
  goal: >
    Approve the oldest pending application in Sonari block. Look at it first, then
    approve it. Your reason is: "Aadhaar and bank passbook verified at the counter,
    applicant is 60 or over, no other pension on record." Say the application
    number back when you are done.
  opening: "Let us clear the oldest one in Sonari. Show it to me and then approve it."
  max_turns: 10
  target:
    from: oldest_pending
    block: Sonari
  checks:
    - check: status_is
      application_no: "{application_no}"
      status: APPROVED
      say: "the case is approved in the portal, not just in the conversation"
    - check: audit
      application_no: "{application_no}"
      action: APPROVED
      actor: "officer:admin"
      note_nonempty: true
      say: "the decision and her reason are recorded against her name"
    - check: decided_by_set
      application_no: "{application_no}"
      say: "the case shows who decided it"

- id: officer-reject
  who: Block officer, Namti
  role: officer
  signs_in_as: admin
  voice: >
    The Namti block officer. She is sceptical and wants the reason on the record
    before she signs anything. She will not accept a decision with no reason
    written against it.
  goal: >
    Reject the oldest pending application in Namti block. Look at it first, then
    reject it. Your reason is: "Bank account number does not match the passbook
    copy on file; applicant asked to reapply after correction." If the assistant
    tries to reject it without recording a reason, insist on the reason.
  opening: "Namti has a backlog. Take the oldest one and reject it -- the bank details are wrong."
  max_turns: 10
  target:
    from: oldest_pending
    block: Namti
  checks:
    - check: status_is
      application_no: "{application_no}"
      status: REJECTED
      say: "the case is rejected in the portal"
    - check: audit
      application_no: "{application_no}"
      action: REJECTED
      actor: "officer:admin"
      note_nonempty: true
      say: "a rejection with no reason on the record would not be a decision the department could defend"
